---
layout: default
---
<section class="shell utility-page" data-redirect="{{ '/' | relative_url }}#{{ page.section }}">
  <p class="eyebrow">Same work, one page</p>
  <h1>{{ page.title }}</h1>
  <p>This section is now part of my homepage.</p>
  <a class="button" href="{{ '/' | relative_url }}#{{ page.section }}">Continue to {{ page.title | downcase }} <span aria-hidden="true">→</span></a>
</section>
