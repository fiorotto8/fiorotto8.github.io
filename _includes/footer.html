{% include base_path %}

<div class="site-footer">
  <div class="site-footer__identity">
    <strong>{{ site.author.name }}</strong>
    <span>Experimental particle &amp; astroparticle physics</span>
  </div>

  <nav class="site-footer__links" aria-label="Footer navigation">
    <a href="mailto:{{ site.author.email }}">Email</a>
    <a href="https://github.com/{{ site.author.github }}">GitHub</a>
    <a href="{{ site.author.orcid }}">ORCID</a>
    <a href="{{ site.author.scopus }}">Scopus</a>
    <a href="{{ base_path }}/sitemap.xml">Sitemap</a>
  </nav>

  <p class="page__footer-copyright">
    &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}.
    Built with <a href="https://jekyllrb.com/" rel="nofollow">Jekyll</a>.
  </p>
</div>
