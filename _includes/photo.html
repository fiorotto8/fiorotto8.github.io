{% assign photo = site.data.photos[include.key] %}
<img src="{{ photo.src | relative_url }}"
     srcset="{% for variant in photo.variants %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
     sizes="{{ include.sizes | default: '(max-width: 599px) calc(100vw - 40px), 50vw' }}"
     width="{{ photo.width }}" height="{{ photo.height }}"
     alt="{{ include.alt | escape }}" decoding="async"
     {% if include.eager %}fetchpriority="high"{% else %}loading="lazy"{% endif %}>
