{% assign description = page.description | default: site.description %}
{% assign canonical_path = page.canonical_path | default: page.url %}
<title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ description | escape }}">
<link rel="canonical" href="{{ canonical_path | absolute_url }}">
{% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:locale" content="en_GB">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ canonical_path | absolute_url }}">
<meta property="og:image" content="{{ '/images/public/identity/social-card.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Davide Fiorina — experimental particle and astroparticle physicist">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ description | escape }}">
<meta name="twitter:image" content="{{ '/images/public/identity/social-card.png' | absolute_url }}">
<meta name="twitter:image:alt" content="Davide Fiorina — experimental particle and astroparticle physicist">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.name | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "description": {{ site.description | jsonify }},
  "image": {{ '/images/public/personal/portraits/davide-fiorina-portrait-640.webp' | absolute_url | jsonify }},
  "sameAs": [{{ site.author.orcid | jsonify }}, {{ site.author.scopus | jsonify }}, {{ site.author.github | prepend: 'https://github.com/' | jsonify }}]
}
</script>
